[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intrader"
version = "0.4.0"
description = "Local NIFTY intraday market-analysis assistant"
requires-python = ">=3.11,<3.12"
dependencies = [
  "keyring>=25.5,<26",
  "pyotp>=2.9,<3",
  "requests>=2.32,<3",
  "smartapi-python==1.5.5",
  "websocket-client>=1.8,<2",
  "tzdata>=2026.1,<2027",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]
ui = [
  "PySide6>=6.8,<7",
  "pyqtgraph>=0.13.7,<0.14",
]
build = [
  "PyInstaller>=6.11,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
intrader-ui = "intrader.ui.app:main"

