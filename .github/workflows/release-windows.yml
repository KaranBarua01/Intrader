name: Build Windows Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[ui,build]"

      - name: Build Intrader
        shell: powershell
        run: .\scripts\build_windows.ps1

      - name: Package
        shell: powershell
        run: |
          Compress-Archive -Path ".\dist\Intrader\*" -DestinationPath ".\dist\Intrader-Windows-x64.zip" -Force
          $hash = (Get-FileHash ".\dist\Intrader-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path ".\dist\Intrader-Windows-x64.zip.sha256" -Value $hash -NoNewline

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Intrader-Windows-x64.zip
            dist/Intrader-Windows-x64.zip.sha256
